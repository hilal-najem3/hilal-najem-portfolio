<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Hilal Najem | Laravel Systems Engineer</title>
    <meta
      name="description"
      content="Backend-focused Laravel systems engineer building scalable APIs, operational platforms, and structured digital infrastructure."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#07111f" />
    <link rel="canonical" href="https://hilal-najem-portfolio.pages.dev/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css?v=2" />
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#main-content"
      >Skip to main content</a
    >

    <nav
      class="navbar navbar-expand-lg fixed-top"
      aria-label="Primary navigation"
    >
      <div class="container">
        <a class="navbar-brand" href="#home" id="brandPrefix"></a>
        <button
          class="navbar-toggler border-0 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul
            class="navbar-nav ms-auto align-items-lg-center gap-lg-3"
            id="navLinks"
          ></ul>
        </div>
      </div>
    </nav>

    <main id="main-content" tabindex="-1">
      <header class="hero" id="home">
        <div class="container">
          <div class="row align-items-center g-5">
            <div class="col-lg-7">
              <div class="hero-badge fade-up" id="heroBadge"></div>
              <h1 class="fade-up hero-title" id="heroTitle"></h1>
              <h2 class="hero-subtitle fade-up" id="heroSubtitle"></h2>
              <p class="hero-description fade-up" id="heroDescription"></p>
              <div class="hero-buttons fade-up" id="heroButtons"></div>
            </div>
            <div class="col-lg-5">
              <div class="glass-card hero-card fade-up">
                <div class="row g-3 mb-4" id="heroMetrics"></div>
                <h2 class="h4 fw-bold mb-3" id="doctrineTitle"></h2>
                <p class="text-secondary mb-4" id="doctrineText"></p>
                <div class="d-flex flex-wrap gap-2" id="heroTechBadges"></div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <section class="section" id="about">
        <div class="container">
          <div class="text-center mb-5 fade-up">
            <h2 class="section-title" id="aboutTitle"></h2>
            <p class="section-subtitle" id="aboutDesc"></p>
          </div>
          <div class="glass-card doctrine-box fade-up">
            <div class="row align-items-center g-4">
              <div class="col-lg-8">
                <h3 class="quote" id="aboutQuote"></h3>
              </div>
              <div class="col-lg-4 text-lg-end" id="aboutBadges"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="principles">
        <div class="container">
          <div class="text-center mb-5 fade-up">
            <h2 class="section-title" id="principlesTitle"></h2>
            <p class="section-subtitle" id="principlesSubtitle"></p>
          </div>
          <div class="row g-4" id="principlesContainer"></div>
        </div>
      </section>

      <section class="section" id="skills">
        <div class="container">
          <div class="text-center mb-5 fade-up">
            <h2 class="section-title" id="skillsTitle"></h2>
            <p class="section-subtitle" id="skillsSubtitle"></p>
          </div>
          <div class="row g-4" id="skillsContainer"></div>
        </div>
      </section>

      <section class="section" id="process">
        <div class="container">
          <div class="text-center mb-5 fade-up">
            <h2 class="section-title" id="processTitle"></h2>
            <p class="section-subtitle" id="processSubtitle"></p>
          </div>
          <div class="process-wrapper" id="processContainer"></div>
        </div>
      </section>

      <section class="section" id="projects">
        <div class="container">
          <div class="text-center mb-5 fade-up">
            <h2 class="section-title" id="projectsTitle"></h2>
            <p class="section-subtitle" id="projectsSubtitle"></p>
          </div>
          <div
            class="d-flex flex-wrap justify-content-center gap-3 mb-5 fade-up"
            id="filterButtonsContainer"
          ></div>
          <div class="row g-4" id="projectsContainer"></div>
        </div>
      </section>

      <section class="contact-experience" id="contact">
        <div class="contact-noise"></div>
        <div class="container position-relative">
          <div class="contact-wrapper fade-up">
            <div class="contact-left">
              <div class="contact-label" id="contactLabel"></div>
              <h2 class="contact-headline" id="contactHeadline"></h2>
              <p class="contact-text" id="contactText"></p>
              <div class="contact-availability" id="contactAvailability"></div>
            </div>
            <div class="contact-panel" id="contactActions"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <div
          class="d-flex flex-column flex-lg-row justify-content-between align-items-center gap-3"
        >
          <p class="mb-0" id="footerText"></p>
          <div class="d-flex gap-3" id="footerBadges"></div>
        </div>
      </div>
    </footer>

    <button
      type="button"
      class="back-to-top"
      id="backToTop"
      aria-label="Back to top"
    >
      ↑
    </button>
    <div class="toast-container-custom" id="toastContainer"></div>

    <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
      <div
        class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable project-modal-dialog"
      >
        <div class="modal-content project-modal-content">
          <button
            type="button"
            class="btn-close btn-close-white project-modal-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
          <div class="modal-body p-0">
            <div class="project-modal-preview">
              <img
                id="modalImage"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                alt=""
                class="img-fluid w-100 project-modal-image"
              />
              <div class="project-modal-overlay"></div>
              <div class="project-modal-top">
                <div>
                  <span
                    id="modalCategory"
                    class="project-modal-category"
                  ></span>
                  <h2 id="projectModalLabel" class="project-modal-title"></h2>
                  <p
                    id="modalShortDescription"
                    class="project-modal-short-description"
                  ></p>
                </div>
              </div>
            </div>
            <div class="project-modal-body">
              <div class="mb-5">
                <h3 class="project-modal-section-title">Technologies</h3>
                <div id="modalTechStack" class="d-flex flex-wrap gap-2"></div>
              </div>
              <div class="mb-5">
                <h3 class="project-modal-section-title">Project Overview</h3>
                <p id="modalDescription" class="project-modal-text"></p>
              </div>
              <div class="mb-5">
                <h3 class="project-modal-section-title">Key Features</h3>
                <div id="modalFeatures" class="row g-4"></div>
              </div>
              <div class="mb-5">
                <h3 class="project-modal-section-title">
                  Main Pages & Purpose
                </h3>
                <ul id="modalPages" class="project-modal-pages"></ul>
              </div>
              <div class="d-flex flex-wrap gap-3 align-items-center">
                <a
                  id="modalLiveLink"
                  href="#"
                  target="_blank"
                  class="btn btn-primary-custom"
                  >Visit Live Website</a
                >
                <a
                  id="modalGithubLink"
                  href="#"
                  target="_blank"
                  class="btn btn-secondary-custom d-none"
                  >View GitHub</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/scripts/main.js?v=3"></script>
  </body>
</html>
